# retroviseur.37m.gr — Retroviseur PWA on gaff (static SPA served by deploy/server.mjs under pm2)
# Public path: kxkm-prod (TLS, catch-all *.37m.gr) → holden → gaff:3001 (LAN)
# Mirror of /etc/nginx/sites-available/retroviseur.37m.gr.conf on holden — change both sides.
server {
    listen 80;
    server_name retroviseur.37m.gr;

    location / {
        proxy_pass http://10.2.37.103:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }
}
