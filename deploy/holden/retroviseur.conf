# retroviseur.waverz.net — Retroviseur PWA on gaff (static SPA served by deploy/server.mjs under pm2)
# Public path: kxkm-prod (TLS *.waverz.net) → holden → gaff:3001 (LAN). The old name
# retroviseur.37m.gr is redirected at kxkm-prod (D56) but still accepted here.
# Mirror of /etc/nginx/sites-available/retroviseur.conf on holden — change both sides.
server {
    listen 80;
    server_name retroviseur.waverz.net retroviseur.37m.gr;
    # the lab promises not to know who uses it: no access log for this host (docs/LAB.md)
    access_log off;

    location / {
        proxy_pass http://10.2.37.103:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_read_timeout 60s;
        client_max_body_size 9m;   # one sealed frame per request (≤ 8 MB)
    }
}
