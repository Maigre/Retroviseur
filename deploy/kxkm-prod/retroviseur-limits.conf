# /etc/nginx/conf.d/retroviseur-limits.conf on kxkm-prod — mirror. Change both sides.
# Per-client limits for retroviseur.37m.gr, kept in memory only (no access log for
# this host). Only rejected requests are written, with their address, to
# /var/log/nginx/retroviseur-blocked.log — read by fail2ban (jail.d/retroviseur.conf).
limit_req_zone  $binary_remote_addr zone=retro_all:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=retro_lab:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=retro_conn:10m;
