# /etc/nginx/sites-enabled/retroviseur.37m.gr.conf on kxkm-prod — mirror, applied 2026-09-23. Change both sides.
# The lab promises not to know who uses it (docs/LAB.md): this exact-name block wins over
# the *.37m.gr catch-all (which logs every request) and keeps NO access log for this host.
# Abuse is still held: per-client request/connection limits (zones in
# conf.d/retroviseur-limits.conf); only rejected requests are logged, with their address,
# to retroviseur-blocked.log, which fail2ban reads to ban repeat offenders.
server {
    server_name retroviseur.37m.gr;
    listen 443 ssl http2;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_certificate     /etc/nginx/ssl/wildcard.37m.gr/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/wildcard.37m.gr/private.key;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    error_log /var/log/nginx/retroviseur-blocked.log warn;   # rejections (warn) and real errors only
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    limit_conn retro_conn 20;
    limit_req zone=retro_all burst=60 nodelay;
    client_max_body_size 5m;

    location / {
        proxy_pass http://100.67.173.80;   # holden (CT100 on rachael), tailnet
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # the lab API: tighter (an upload is one frame per request, well within this)
    location /api/lab/ {
        limit_req zone=retro_all burst=60 nodelay;
        limit_req zone=retro_lab burst=30 nodelay;
        proxy_pass http://100.67.173.80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
