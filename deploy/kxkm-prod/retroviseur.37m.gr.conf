# /etc/nginx/sites-enabled/retroviseur.37m.gr.conf on kxkm-prod — mirror, applied 2026-09-23. Change both sides.
# The lab promises not to know who uses it (docs/LAB.md). Today the *.37m.gr catch-all
# (wildcard.37m.gr.conf) logs every request to holden-edge-access.log; this exact-name
# block wins over it and turns logging off for this host only. Same TLS and proxy as
# the catch-all. Apply: copy there, `nginx -t`, `systemctl reload nginx`.
server {
    server_name retroviseur.37m.gr;
    listen 443 ssl http2;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_certificate     /etc/nginx/ssl/wildcard.37m.gr/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/wildcard.37m.gr/private.key;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    client_max_body_size 5m;
    location / {
        proxy_pass http://100.67.173.80;   # holden (CT100 on rachael), tailnet
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
