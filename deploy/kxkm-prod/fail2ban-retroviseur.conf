# /etc/fail2ban/jail.d/retroviseur.conf on kxkm-prod — mirror. Change both sides.
# Bans clients that keep hitting retroviseur.37m.gr's rate limits: 20 rejections
# within a minute → blocked on 80/443 for an hour. Reads only the rejection log
# (no access log exists for this host). Tailnet and localhost are never banned.
[retroviseur]
# (jail name = iptables chain "f2b-<name>": keep it short, iptables allows 28 chars)
enabled  = true
filter   = nginx-limit-req[ngx_limit_req_zones="retro_all|retro_lab"]
logpath  = /var/log/nginx/retroviseur-blocked.log
backend  = auto
port     = http,https
maxretry = 20
findtime = 60
bantime  = 3600
ignoreip = 127.0.0.1/8 ::1 100.64.0.0/10
