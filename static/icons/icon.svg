<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background so the same art works as a maskable icon. -->
  <rect width="512" height="512" fill="#007a3d"/>
  <!-- disposable body -->
  <rect x="92" y="150" width="328" height="216" rx="34" fill="#2c2c2c"/>
  <rect x="92" y="150" width="328" height="44" rx="22" fill="#333"/>
  <!-- film-box stripes -->
  <rect x="92" y="330" width="328" height="14" fill="#ffc20e"/>
  <rect x="92" y="344" width="328" height="8" fill="#e4002b"/>
  <!-- tunnel viewfinder -->
  <rect x="124" y="176" width="64" height="40" rx="9" fill="#0a0a0a"/>
  <!-- frame counter window -->
  <rect x="326" y="176" width="62" height="34" rx="7" fill="#e9e3cf"/>
  <text x="357" y="202" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="26" fill="#111">27</text>
  <!-- lens -->
  <circle cx="256" cy="276" r="74" fill="#0b0b0b" stroke="#474747" stroke-width="14"/>
  <circle cx="256" cy="276" r="40" fill="#141c22"/>
  <circle cx="240" cy="260" r="12" fill="#3b4a55"/>
  <!-- thumbwheel ribs -->
  <g fill="#1a1a1a"><rect x="404" y="226" width="16" height="8"/><rect x="404" y="244" width="16" height="8"/><rect x="404" y="262" width="16" height="8"/><rect x="404" y="280" width="16" height="8"/><rect x="404" y="298" width="16" height="8"/></g>
</svg>
